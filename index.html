<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>⌨️ 키캡 클리커 — 클릭해서 나만의 키캡 꾸미기</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c14;
  --bg2:#121524;
  --panel:rgba(20,24,40,0.85);
  --panel2:rgba(30,36,58,0.9);
  --border:rgba(120,140,220,0.22);
  --accent:#5ad1ff;
  --accent2:#7c5cff;
  --gold:#ffd24a;
  --green:#39e08a;
  --red:#ff5c6c;
  --text:#e8ecf8;
  --dim:rgba(232,236,248,0.5);
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:radial-gradient(ellipse at 30% 0%, #1a1d3a 0%, var(--bg) 55%, #05060c 100%);
  color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  overflow-x:hidden;
  min-height:100vh;
  user-select:none;
}
/* drifting glow background */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 80% 20%, rgba(124,92,255,0.12), transparent 45%),
    radial-gradient(circle at 15% 75%, rgba(90,209,255,0.10), transparent 45%);
  animation:bgShift 14s ease-in-out infinite alternate;
}
@keyframes bgShift{0%{transform:translate(0,0)}100%{transform:translate(-3%,2%)}}

.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 14px 40px;}

/* ===== Header ===== */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:14px;
}
.logo{
  font-family:'Black Han Sans',sans-serif;font-size:1.5rem;
  background:linear-gradient(120deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:-0.5px;display:flex;align-items:center;gap:6px;
}
.logo small{font-family:'Noto Sans KR';font-size:0.6rem;color:var(--dim);-webkit-text-fill-color:var(--dim);letter-spacing:1px;}
.icon-btn{
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  width:40px;height:40px;border-radius:12px;font-size:1.1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.icon-btn:active{transform:scale(.92);}

/* ===== Stat cards ===== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.stat{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:10px 8px;text-align:center;backdrop-filter:blur(8px);
}
.stat .v{font-family:'Black Han Sans',sans-serif;font-size:1.25rem;line-height:1.1;}
.stat.pts .v{color:var(--gold);}
.stat .l{font-size:0.62rem;color:var(--dim);margin-top:3px;letter-spacing:0.5px;}

/* ===== Keycap stage ===== */
.stage{
  position:relative;display:flex;flex-direction:column;align-items:center;
  padding:26px 0 14px;margin-bottom:8px;
}
.stage-hint{font-size:0.72rem;color:var(--dim);margin-bottom:18px;text-align:center;}
.stage-hint b{color:var(--accent);}

.keycap-zone{position:relative;width:200px;height:210px;display:flex;align-items:center;justify-content:center;cursor:pointer;}

/* keycap built from two stacked layers for a 3D look */
.keycap{
  position:relative;width:150px;height:150px;
  transition:transform .08s cubic-bezier(.2,.8,.3,1.4);
  will-change:transform;
}
.keycap .base{
  position:absolute;inset:0;border-radius:18px;
  background:var(--cap-side,#c9ccd6);
  box-shadow:0 14px 0 var(--cap-deep,#9a9da8), 0 24px 36px rgba(0,0,0,0.55);
}
.keycap .top{
  position:absolute;left:8px;right:8px;top:4px;bottom:18px;border-radius:14px;
  background:linear-gradient(160deg, var(--cap-light,#fff) 0%, var(--cap-top,#eef0f6) 55%, var(--cap-side,#d6d9e2) 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 2px 4px rgba(255,255,255,0.6), inset 0 -6px 10px rgba(0,0,0,0.12);
  overflow:hidden;
}
.keycap .legend{
  font-size:3.4rem;line-height:1;color:var(--legend,#2a2d3a);
  font-family:'Black Han Sans',sans-serif;
  text-shadow:0 1px 0 rgba(255,255,255,0.4);
  pointer-events:none;
}
.keycap-zone.press .keycap{transform:translateY(10px) scale(.97);}
.keycap-zone.press .base{box-shadow:0 4px 0 var(--cap-deep,#9a9da8), 0 10px 18px rgba(0,0,0,0.5);}

/* shape variants via class on .keycap */
.keycap.s-round .base,.keycap.s-round .top{border-radius:34px;}
.keycap.s-circle .base{border-radius:50%;}
.keycap.s-circle .top{border-radius:50%;left:10px;right:10px;top:6px;bottom:20px;}
.keycap.s-pill{width:190px;}
.keycap.s-pill .base,.keycap.s-pill .top{border-radius:40px;}
.keycap.s-hex .base,.keycap.s-hex .top{border-radius:6px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);}
.keycap.s-diamond .base,.keycap.s-diamond .top{border-radius:6px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
.keycap.s-flower .base,.keycap.s-flower .top{border-radius:46% 54% 50% 50%/54% 46% 54% 46%;}

/* effects via class on .keycap-zone */
.keycap-zone.fx-glow .keycap .base{box-shadow:0 14px 0 var(--cap-deep,#9a9da8),0 0 40px 6px var(--accent),0 24px 36px rgba(0,0,0,0.55);}
.keycap-zone.fx-rainbow .keycap{animation:hue 4s linear infinite;}
@keyframes hue{to{filter:hue-rotate(360deg);}}
.keycap-zone.fx-gold .keycap .base{box-shadow:0 14px 0 #b8860b,0 0 44px 8px rgba(255,210,74,0.7),0 24px 36px rgba(0,0,0,0.55);}
.keycap-zone.fx-gold .keycap .top{box-shadow:inset 0 2px 4px rgba(255,255,255,0.7),inset 0 -6px 10px rgba(140,90,0,0.25);}
.keycap-zone.fx-neon .keycap .legend{text-shadow:0 0 10px var(--accent),0 0 22px var(--accent);color:#fff;}
.keycap-zone.fx-neon .keycap .top{background:linear-gradient(160deg,#16182a,#0d0f1c);}

/* floating +N */
.floaty{position:absolute;font-family:'Black Han Sans',sans-serif;font-size:1.4rem;color:var(--gold);
  pointer-events:none;z-index:5;text-shadow:0 2px 6px rgba(0,0,0,0.6);animation:floatUp .9s ease-out forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.8);}100%{opacity:0;transform:translateY(-70px) scale(1.25);}}

/* click particles */
.particle{position:absolute;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:4;}
@keyframes burst{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2);}}

/* per-click value pill */
.power-pill{font-size:0.74rem;color:var(--dim);margin-top:6px;}
.power-pill b{color:var(--accent);}

/* ===== Tabs ===== */
.tabs{display:flex;gap:6px;margin:16px 0 12px;overflow-x:auto;padding-bottom:2px;}
.tab{
  flex:0 0 auto;padding:9px 14px;border-radius:12px;cursor:pointer;font-size:0.82rem;font-weight:700;
  background:var(--panel);border:1px solid var(--border);color:var(--dim);white-space:nowrap;transition:.15s;
}
.tab.active{background:linear-gradient(120deg,var(--accent2),var(--accent));color:#0a0c14;border-color:transparent;}

/* ===== Shop grid ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:12px 8px 10px;text-align:center;cursor:pointer;transition:.15s;position:relative;overflow:hidden;
}
.card:active{transform:scale(.96);}
.card .swatch{
  width:54px;height:54px;border-radius:12px;margin:0 auto 8px;
  display:flex;align-items:center;justify-content:center;font-size:1.8rem;
  box-shadow:0 4px 10px rgba(0,0,0,0.4),inset 0 1px 2px rgba(255,255,255,0.3);
}
.card .nm{font-size:0.72rem;font-weight:700;margin-bottom:4px;}
.card .price{font-size:0.7rem;color:var(--gold);font-weight:700;}
.card .price.free{color:var(--green);}
.card.owned .price{color:var(--dim);}
.card.equipped{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 18px rgba(90,209,255,0.25);}
.card.equipped::after{content:'착용중';position:absolute;top:6px;right:6px;font-size:0.55rem;background:var(--accent);color:#0a0c14;padding:1px 5px;border-radius:6px;font-weight:900;}
.card.locked{opacity:.85;}
.card.cantafford .price{color:var(--red);}

/* upgrade rows */
.up-row{
  display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);
  border-radius:14px;padding:12px 14px;margin-bottom:10px;
}
.up-row .ico{font-size:1.7rem;}
.up-row .info{flex:1;}
.up-row .info .t{font-weight:800;font-size:0.92rem;}
.up-row .info .d{font-size:0.7rem;color:var(--dim);margin-top:2px;}
.up-row .info .lv{font-size:0.68rem;color:var(--accent);margin-top:3px;font-weight:700;}
.buy-btn{
  background:linear-gradient(120deg,var(--accent2),var(--accent));color:#0a0c14;font-weight:900;
  border:none;border-radius:10px;padding:9px 14px;cursor:pointer;font-family:inherit;font-size:0.82rem;
  white-space:nowrap;transition:.12s;min-width:72px;
}
.buy-btn:active{transform:scale(.93);}
.buy-btn:disabled{background:#2a2e44;color:var(--dim);cursor:not-allowed;}

.section-note{font-size:0.72rem;color:var(--dim);margin:0 2px 12px;line-height:1.6;}

/* toast */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:11px 18px;border-radius:12px;font-size:0.84rem;font-weight:700;z-index:50;
  opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(8px);max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.good{border-color:var(--green);} .toast.bad{border-color:var(--red);}

/* daily banner */
.daily{
  background:linear-gradient(120deg,rgba(124,92,255,0.18),rgba(90,209,255,0.12));
  border:1px solid var(--border);border-radius:14px;padding:10px 14px;margin-bottom:14px;
  font-size:0.78rem;display:flex;align-items:center;gap:8px;
}
.daily b{color:var(--gold);}

footer{text-align:center;color:var(--dim);font-size:0.66rem;margin-top:26px;line-height:1.7;}
footer a{color:var(--accent);text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="logo">⌨️ 키캡 클리커 <small>CLICK · EARN · CUSTOMIZE</small></div>
    <button class="icon-btn" id="resetBtn" title="초기화">↺</button>
  </div>

  <div class="daily" id="dailyBanner">🎁 오늘의 첫 클릭 보너스가 기다리고 있어요!</div>

  <div class="stats">
    <div class="stat pts"><div class="v" id="sPoints">0</div><div class="l">보유 포인트</div></div>
    <div class="stat"><div class="v" id="sToday">0</div><div class="l">오늘 클릭</div></div>
    <div class="stat"><div class="v" id="sTotal">0</div><div class="l">누적 클릭</div></div>
  </div>

  <div class="stage">
    <div class="stage-hint">키캡을 <b>탭/클릭</b> 할 때마다 포인트가 쌓여요. 오늘 클릭한 만큼 하루치 포인트가 들어옵니다!</div>
    <div class="keycap-zone" id="keycapZone">
      <div class="keycap" id="keycap">
        <div class="base"></div>
        <div class="top"><span class="legend" id="legend">⌨</span></div>
      </div>
    </div>
    <div class="power-pill">클릭당 <b id="perClick">+1</b> 포인트 · 자동 <b id="autoRate">+0</b>/초</div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="colors">🎨 색상</div>
    <div class="tab" data-tab="shapes">🔷 모양</div>
    <div class="tab" data-tab="legends">✦ 각인</div>
    <div class="tab" data-tab="effects">✨ 효과</div>
    <div class="tab" data-tab="upgrades">⚙️ 업그레이드</div>
  </div>

  <div class="section-note" id="sectionNote"></div>
  <div id="panel"></div>

  <footer>
    포인트는 자동 저장됩니다 · 매일 0시에 "오늘 클릭"이 초기화돼요<br>
    <a href="install.html">📱 앱으로 설치하기</a>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============== 데이터 정의 ============== */
const SHOP = {
  colors:[
    {id:'white',  nm:'화이트',  cost:0,    cap:'#f4f5fa'},
    {id:'ink',    nm:'잉크',    cost:0,    cap:'#2b2f44'},
    {id:'mint',   nm:'민트',    cost:120,  cap:'#7fe6c4'},
    {id:'coral',  nm:'코랄',    cost:120,  cap:'#ff8d7a'},
    {id:'sky',    nm:'스카이',  cost:200,  cap:'#6cc4ff'},
    {id:'grape',  nm:'그레이프',cost:280,  cap:'#9b7bff'},
    {id:'lemon',  nm:'레몬',    cost:280,  cap:'#ffe066'},
    {id:'rose',   nm:'로즈',    cost:400,  cap:'#ff79b0'},
    {id:'forest', nm:'포레스트',cost:400,  cap:'#5cc878'},
    {id:'sunset', nm:'선셋',    cost:650,  cap:'#ff7a45'},
    {id:'ocean',  nm:'오션',    cost:650,  cap:'#1fb6c9'},
    {id:'galaxy', nm:'갤럭시',  cost:1200, cap:'#6a4cff'},
  ],
  shapes:[
    {id:'classic', nm:'클래식', cost:0,    cls:'',          ic:'⬛'},
    {id:'round',   nm:'라운드', cost:150,  cls:'s-round',   ic:'🟦'},
    {id:'circle',  nm:'서클',   cost:300,  cls:'s-circle',  ic:'⚪'},
    {id:'pill',    nm:'필',     cost:300,  cls:'s-pill',    ic:'💊'},
    {id:'hex',     nm:'헥사곤', cost:550,  cls:'s-hex',     ic:'⬡'},
    {id:'diamond', nm:'다이아', cost:700,  cls:'s-diamond', ic:'🔶'},
    {id:'flower',  nm:'플라워', cost:1000, cls:'s-flower',  ic:'🌸'},
  ],
  legends:[
    {id:'kbd',   nm:'키보드', cost:0,    ch:'⌨'},
    {id:'A',     nm:'A',     cost:0,    ch:'A'},
    {id:'star',  nm:'스타',  cost:90,   ch:'★'},
    {id:'heart', nm:'하트',  cost:90,   ch:'♥'},
    {id:'bolt',  nm:'번개',  cost:180,  ch:'⚡'},
    {id:'cat',   nm:'고양이',cost:260,  ch:'🐱'},
    {id:'crown', nm:'왕관',  cost:350,  ch:'👑'},
    {id:'fire',  nm:'불꽃',  cost:350,  ch:'🔥'},
    {id:'skull', nm:'해골',  cost:480,  ch:'💀'},
    {id:'rocket',nm:'로켓',  cost:600,  ch:'🚀'},
    {id:'gem',   nm:'보석',  cost:800,  ch:'💎'},
    {id:'spark', nm:'반짝',  cost:1100, ch:'✨'},
  ],
  effects:[
    {id:'none',    nm:'없음',     cost:0,    cls:''},
    {id:'glow',    nm:'네온 글로우',cost:300, cls:'fx-glow'},
    {id:'neon',    nm:'네온 각인', cost:500,  cls:'fx-neon'},
    {id:'rainbow', nm:'레인보우',  cost:900,  cls:'fx-rainbow'},
    {id:'gold',    nm:'골드 오라', cost:1600, cls:'fx-gold'},
  ],
};

const UPGRADES = [
  {id:'power', ico:'💪', t:'클릭 파워', d:'클릭 한 번당 포인트 +1', baseCost:80,  growth:1.6, start:1},
  {id:'auto',  ico:'🤖', t:'자동 클릭기', d:'1초마다 자동으로 포인트 획득', baseCost:250, growth:1.8, start:0},
];

/* ============== 상태 ============== */
const SAVE_KEY = 'keycapClickerSave_v1';
const todayStr = ()=>{ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };

const defaultState = ()=>({
  points:0, totalEarned:0, totalClicks:0,
  todayClicks:0, todayDate:todayStr(), gotDailyBonus:false,
  owned:{ colors:['white','ink'], shapes:['classic'], legends:['kbd','A'], effects:['none'] },
  equipped:{ color:'white', shape:'classic', legend:'kbd', effect:'none' },
  power:1, auto:0,
});

let state = load();

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return defaultState();
    const s = Object.assign(defaultState(), JSON.parse(raw));
    s.owned = Object.assign(defaultState().owned, s.owned||{});
    s.equipped = Object.assign(defaultState().equipped, s.equipped||{});
    return s;
  }catch(e){ return defaultState(); }
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }

/* ============== 색상 헬퍼 ============== */
function shade(hex, pct){ // pct<0 어둡게, >0 밝게
  const h = hex.replace('#','');
  let r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
  const f = pct<0 ? 0 : 255, p = Math.abs(pct);
  r=Math.round((f-r)*p+r); g=Math.round((f-g)*p+g); b=Math.round((f-b)*p+b);
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function legendColor(cap){
  const h=cap.replace('#','');
  const lum=0.299*parseInt(h.substr(0,2),16)+0.587*parseInt(h.substr(2,2),16)+0.114*parseInt(h.substr(4,2),16);
  return lum>150 ? '#2a2d3a' : '#f4f5fa';
}

/* ============== DOM ============== */
const $ = id=>document.getElementById(id);
const keycap=$('keycap'), zone=$('keycapZone'), legendEl=$('legend');
const sPoints=$('sPoints'), sToday=$('sToday'), sTotal=$('sTotal');
const perClickEl=$('perClick'), autoRateEl=$('autoRate');
const panel=$('panel'), sectionNote=$('sectionNote'), dailyBanner=$('dailyBanner');

let curTab='colors';

/* ============== 렌더 ============== */
function fmt(n){ return n.toLocaleString('ko-KR'); }

function applyKeycap(){
  const col = SHOP.colors.find(c=>c.id===state.equipped.color) || SHOP.colors[0];
  const shp = SHOP.shapes.find(c=>c.id===state.equipped.shape) || SHOP.shapes[0];
  const leg = SHOP.legends.find(c=>c.id===state.equipped.legend) || SHOP.legends[0];
  const fx  = SHOP.effects.find(c=>c.id===state.equipped.effect) || SHOP.effects[0];

  keycap.style.setProperty('--cap-top', col.cap);
  keycap.style.setProperty('--cap-light', shade(col.cap, 0.35));
  keycap.style.setProperty('--cap-side', shade(col.cap, -0.12));
  keycap.style.setProperty('--cap-deep', shade(col.cap, -0.32));
  keycap.style.setProperty('--legend', legendColor(col.cap));

  keycap.className = 'keycap ' + (shp.cls||'');
  zone.className = 'keycap-zone ' + (fx.cls||'');
  legendEl.textContent = leg.ch;
}

function renderStats(){
  sPoints.textContent = fmt(state.points);
  sToday.textContent = fmt(state.todayClicks);
  sTotal.textContent = fmt(state.totalClicks);
  perClickEl.textContent = '+'+state.power;
  autoRateEl.textContent = '+'+state.auto;
}

function renderDaily(){
  if(state.gotDailyBonus){
    dailyBanner.innerHTML = '🔥 오늘도 좋아요! 누적 클릭 <b>'+fmt(state.totalClicks)+'</b> 회 달성 중';
  }else{
    dailyBanner.innerHTML = '🎁 오늘의 첫 클릭 보너스 <b>+50</b> 포인트가 기다리고 있어요!';
  }
}

const NOTES = {
  colors:'키캡 색상을 골라보세요. 보유한 색은 자유롭게 바꿀 수 있어요.',
  shapes:'키캡 모양을 바꿔 나만의 키를 만들어 보세요.',
  legends:'키캡 위에 새겨질 각인(글자·아이콘)을 선택하세요.',
  effects:'키캡 주변 특수 효과를 입혀보세요.',
  upgrades:'포인트 획득량을 늘려 더 빠르게 모아보세요.',
};

function renderPanel(){
  sectionNote.textContent = NOTES[curTab];
  if(curTab==='upgrades'){ renderUpgrades(); return; }

  const list = SHOP[curTab];
  const ownedArr = state.owned[curTab];
  const equipKey = {colors:'color',shapes:'shape',legends:'legend',effects:'effect'}[curTab];
  const equipped = state.equipped[equipKey];

  let html = '<div class="grid">';
  for(const item of list){
    const owned = ownedArr.includes(item.id);
    const isEq = equipped===item.id;
    const afford = state.points >= item.cost;
    let cls='card';
    if(owned) cls+=' owned'; else cls+=' locked';
    if(isEq) cls+=' equipped';
    if(!owned && !afford) cls+=' cantafford';

    // swatch
    let sw='';
    if(curTab==='colors'){
      sw = `<div class="swatch" style="background:linear-gradient(160deg,${shade(item.cap,0.3)},${item.cap} 60%,${shade(item.cap,-0.15)})"></div>`;
    }else if(curTab==='shapes'){
      sw = `<div class="swatch" style="background:#1c2036">${item.ic}</div>`;
    }else if(curTab==='legends'){
      sw = `<div class="swatch" style="background:#1c2036">${item.ch}</div>`;
    }else if(curTab==='effects'){
      sw = `<div class="swatch" style="background:#1c2036">${item.id==='none'?'∅':'✨'}</div>`;
    }

    let price;
    if(owned) price = isEq ? '착용중' : '보유';
    else price = item.cost===0 ? '<span class="free">무료</span>' : '💰 '+fmt(item.cost);

    html += `<div class="${cls}" data-id="${item.id}">${sw}<div class="nm">${item.nm}</div><div class="price${item.cost===0&&!owned?' free':''}">${price}</div></div>`;
  }
  html+='</div>';
  panel.innerHTML = html;

  panel.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click',()=>handleShopClick(card.dataset.id));
  });
}

function renderUpgrades(){
  let html='';
  for(const u of UPGRADES){
    const lvl = state[u.id];
    const effectiveLvl = u.id==='power' ? lvl-1 : lvl; // power 시작값 1
    const cost = upgradeCost(u);
    const afford = state.points>=cost;
    html += `<div class="up-row">
      <div class="ico">${u.ico}</div>
      <div class="info">
        <div class="t">${u.t}</div>
        <div class="d">${u.d}</div>
        <div class="lv">현재 ${u.id==='power'?('클릭당 +'+lvl):(lvl+' /초')} · Lv.${effectiveLvl}</div>
      </div>
      <button class="buy-btn" data-up="${u.id}" ${afford?'':'disabled'}>💰 ${fmt(cost)}</button>
    </div>`;
  }
  panel.innerHTML = html;
  panel.querySelectorAll('.buy-btn').forEach(b=>{
    b.addEventListener('click',()=>buyUpgrade(b.dataset.up));
  });
}

function upgradeCost(u){
  const lvl = u.id==='power' ? state.power-1 : state.auto;
  return Math.round(u.baseCost * Math.pow(u.growth, lvl));
}

/* ============== 상호작용 ============== */
function handleShopClick(id){
  const list = SHOP[curTab];
  const item = list.find(x=>x.id===id);
  const ownedArr = state.owned[curTab];
  const equipKey = {colors:'color',shapes:'shape',legends:'legend',effects:'effect'}[curTab];

  if(ownedArr.includes(id)){
    // 착용
    state.equipped[equipKey] = id;
    applyKeycap(); save(); renderPanel();
    toast('적용했어요: '+item.nm,'good');
  }else{
    // 구매
    if(state.points < item.cost){ toast('포인트가 부족해요 (💰'+fmt(item.cost)+')','bad'); return; }
    state.points -= item.cost;
    ownedArr.push(id);
    state.equipped[equipKey] = id;
    applyKeycap(); renderStats(); save(); renderPanel();
    toast('구매 완료! '+item.nm+' 착용 🎉','good');
  }
}

function buyUpgrade(uid){
  const u = UPGRADES.find(x=>x.id===uid);
  const cost = upgradeCost(u);
  if(state.points < cost){ toast('포인트가 부족해요','bad'); return; }
  state.points -= cost;
  state[uid] += 1;
  renderStats(); renderUpgrades(); save();
  toast(u.t+' 업그레이드! 🚀','good');
}

/* 클릭 */
function checkDaily(){
  const t = todayStr();
  if(state.todayDate !== t){
    state.todayDate = t;
    state.todayClicks = 0;
    state.gotDailyBonus = false;
    renderDaily();
  }
}

function gainPoints(n){
  state.points += n;
  state.totalEarned += n;
}

function doClick(e){
  checkDaily();

  // 첫 클릭 보너스
  if(!state.gotDailyBonus){
    state.gotDailyBonus = true;
    gainPoints(50);
    toast('🎁 오늘의 첫 클릭 보너스 +50!','good');
    renderDaily();
  }

  const val = state.power;
  gainPoints(val);
  state.todayClicks += 1;
  state.totalClicks += 1;

  renderStats();
  floaty(e, '+'+val);
  burst(e);
  save();
}

let lastSave=0;
zone.addEventListener('pointerdown', e=>{
  zone.classList.add('press');
  doClick(e);
});
zone.addEventListener('pointerup', ()=>zone.classList.remove('press'));
zone.addEventListener('pointerleave', ()=>zone.classList.remove('press'));
zone.addEventListener('contextmenu', e=>e.preventDefault());

/* 키보드 스페이스로도 클릭 */
window.addEventListener('keydown', e=>{
  if(e.code==='Space' && e.target===document.body){
    e.preventDefault();
    const r = zone.getBoundingClientRect();
    doClick({clientX:r.left+r.width/2, clientY:r.top+r.height/2});
    zone.classList.add('press'); setTimeout(()=>zone.classList.remove('press'),90);
  }
});

/* ============== 이펙트 ============== */
function floaty(e, txt){
  const f = document.createElement('div');
  f.className='floaty'; f.textContent=txt;
  const r = zone.getBoundingClientRect();
  const x = (e.clientX||r.left+r.width/2) - r.left;
  const y = (e.clientY||r.top+r.height/2) - r.top;
  f.style.left = x+'px'; f.style.top = y+'px';
  zone.appendChild(f);
  setTimeout(()=>f.remove(), 900);
}

const PCOLORS=['#5ad1ff','#7c5cff','#ffd24a','#39e08a','#ff79b0','#ff8d7a'];
function burst(e){
  const r = zone.getBoundingClientRect();
  const x = (e.clientX||r.left+r.width/2) - r.left;
  const y = (e.clientY||r.top+r.height/2) - r.top;
  const n = 6;
  for(let i=0;i<n;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=x+'px'; p.style.top=y+'px';
    p.style.background=PCOLORS[i%PCOLORS.length];
    const ang=(Math.PI*2*i)/n + Math.random()*0.6;
    const dist=40+Math.random()*30;
    p.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    p.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    p.style.animation='burst .6s ease-out forwards';
    zone.appendChild(p);
    setTimeout(()=>p.remove(),600);
  }
}

let toastTimer;
function toast(msg, kind){
  const t=$('toast');
  t.textContent=msg;
  t.className='toast show'+(kind?' '+kind:'');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ============== 자동 클릭기 ============== */
setInterval(()=>{
  if(state.auto>0){
    checkDaily();
    gainPoints(state.auto);
    renderStats();
  }
}, 1000);

/* 5초마다 저장(자동 수익 보존) */
setInterval(save, 5000);
window.addEventListener('beforeunload', save);

/* ============== 탭 ============== */
$('tabs').addEventListener('click', e=>{
  const tab = e.target.closest('.tab'); if(!tab) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  curTab = tab.dataset.tab;
  renderPanel();
});

/* ============== 초기화 ============== */
$('resetBtn').addEventListener('click',()=>{
  if(confirm('정말 모든 진행 상황을 초기화할까요?\n(포인트·클릭 기록·구매 항목이 모두 사라져요)')){
    state = defaultState(); save();
    applyKeycap(); renderStats(); renderDaily(); renderPanel();
    toast('초기화되었어요','good');
  }
});

/* ============== 시작 ============== */
checkDaily();
applyKeycap();
renderStats();
renderDaily();
renderPanel();
</script>
</body>
</html>
